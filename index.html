<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashscore - Fútbol en Directo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fsDark: '#0f172a',
                        fsHeader: '#1a2233',
                        fsOrange: '#e85d04',
                        fsGreen: '#22c55e',
                        fsGray: '#334155'
                    }
                }
            }
        }
    </script>
    <style>
        .live-pulse { animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

    <!-- Flashscore Header -->
    <header class="bg-fsHeader border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2 cursor-pointer">
                    <div class="bg-fsOrange text-white font-black px-2.5 py-1 rounded text-lg tracking-wider">FS</div>
                    <span class="text-xl font-black tracking-tight text-white">flashscore</span>
                </div>
                <nav class="hidden md:flex items-center space-x-1 text-sm font-semibold">
                    <button class="px-3 py-1.5 rounded bg-fsOrange text-white flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-futbol"></i> Fútbol
                    </button>
                </nav>
            </div>
            <div class="flex items-center space-x-3 text-sm">
                <button class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-slate-300 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-search"></i> <span class="hidden sm:inline">Buscar</span>
                </button>
                <button class="bg-fsOrange hover:bg-orange-600 px-3 py-1.5 rounded text-white font-bold transition">
                    Mi Cuenta
                </button>
            </div>
        </div>

        <!-- Sub-header / Date & Filters bar -->
        <div class="bg-slate-800/80 border-t border-slate-700/60 px-4 py-2">
            <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button onclick="setFilter('all')" id="f-all" class="px-3 py-1 rounded bg-fsOrange text-white font-bold transition">Todo</button>
                    <button onclick="setFilter('live')" id="f-live" class="px-3 py-1 rounded text-slate-300 hover:text-white transition flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-fsGreen live-pulse"></span> En directo
                    </button>
                    <button onclick="setFilter('finished')" id="f-finished" class="px-3 py-1 rounded text-slate-300 hover:text-white transition">Finalizados</button>
                    <button onclick="setFilter('scheduled')" id="f-scheduled" class="px-3 py-1 rounded text-slate-300 hover:text-white transition">Programados</button>
                </div>
                <div class="flex items-center gap-2 text-slate-300 font-medium">
                    <button class="hover:text-white px-2 py-1 rounded bg-slate-700/50"><i class="fa-solid fa-chevron-left text-[10px]"></i> Ayer</button>
                    <span class="text-white font-bold px-2 bg-slate-900 py-1 rounded border border-slate-700">📅 Hoy</span>
                    <button class="hover:text-white px-2 py-1 rounded bg-slate-700/50">Mañana <i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-4 space-y-4">
        <div class="bg-slate-800 px-4 py-2 rounded-t-lg border-b border-slate-700 flex justify-between items-center text-xs text-slate-400 font-semibold uppercase tracking-wider">
            <span>Partidos de Fútbol en Directo y Resultados</span>
            <span class="hidden sm:inline">Cuotas 1X2</span>
        </div>

        <div id="matchesContainer" class="bg-slate-800/40 rounded-b-lg border border-slate-800 shadow-xl overflow-hidden divide-y divide-slate-800">
            <!-- Populated by JS -->
        </div>
    </main>

    <!-- Match Modal (Flashscore Center) -->
    <div id="matchModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
            <div class="bg-slate-800 px-4 py-3 border-b border-slate-700 flex justify-between items-center">
                <div id="modalLeague" class="text-xs font-bold text-fsOrange uppercase tracking-wider">Liga</div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="bg-gradient-to-b from-slate-800 to-slate-900 p-6 text-center border-b border-slate-800 space-y-3">
                <div id="modalStatus" class="inline-block px-2.5 py-1 rounded text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">En Directo 74'</div>
                <div class="grid grid-cols-3 items-center gap-4">
                    <div id="modalHome" class="text-lg sm:text-xl font-black text-right">Local</div>
                    <div id="modalScore" class="text-3xl sm:text-4xl font-black font-mono text-fsOrange bg-slate-950/60 py-2 rounded-lg border border-slate-800">2 - 1</div>
                    <div id="modalAway" class="text-lg sm:text-xl font-black text-left">Visitante</div>
                </div>
            </div>
            <div class="bg-slate-800/50 flex border-b border-slate-700 text-xs font-bold">
                <button onclick="switchTab('summary')" id="mtab-summary" class="flex-1 py-3 text-fsOrange border-b-2 border-fsOrange transition">Resumen</button>
                <button onclick="switchTab('stats')" id="mtab-stats" class="flex-1 py-3 text-slate-400 hover:text-white transition">Estadísticas</button>
                <button onclick="switchTab('lineups')" id="mtab-lineups" class="flex-1 py-3 text-slate-400 hover:text-white transition">Alineaciones</button>
                <button onclick="switchTab('standings')" id="mtab-standings" class="flex-1 py-3 text-slate-400 hover:text-white transition">Clasificación</button>
            </div>
            <div id="modalContent" class="p-6 space-y-4 text-sm flex-1"></div>
        </div>
    </div>

    <footer class="max-w-5xl mx-auto px-4 py-8 text-center text-xs text-slate-500 border-t border-slate-800 mt-12">
        <p>&copy; 2026 Flashscore Fútbol. Todos los derechos reservados.</p>
    </footer>

    <script>
        const matches = [
            {
                country: "ESPAÑA", league: "La Liga", flag: "🇪🇸",
                home: "Real Madrid", away: "Barcelona", homeScore: 3, awayScore: 2, status: "FINISHED", time: "Finalizado",
                odds: { 1: "2.25", X: "3.50", 2: "3.10" },
                events: [{ time: "10'", type: "goal", player: "Mbappé", team: "home", score: "1-0" }, { time: "25'", type: "goal", player: "Yamal", team: "away", score: "1-1" }],
                stats: { possession: ["48%", "52%"], shots: ["18", "16"], corners: ["5", "6"] }
            },
            {
                country: "INGLATERRA", league: "Premier League", flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿",
                home: "Arsenal", away: "Chelsea", homeScore: 2, awayScore: 1, status: "LIVE", time: "74'",
                odds: { 1: "1.65", X: "3.80", 2: "5.20" },
                events: [{ time: "18'", type: "goal", player: "Saka", team: "home", score: "1-0" }, { time: "41'", type: "goal", player: "Palmer", team: "away", score: "1-1" }],
                stats: { possession: ["58%", "42%"], shots: ["14", "9"], corners: ["7", "3"] }
            },
            {
                country: "ALEMANIA", league: "Bundesliga", flag: "🇩🇪",
                home: "Bayern Munich", away: "Borussia Dortmund", homeScore: null, awayScore: null, status: "SCHEDULED", time: "20:30",
                odds: { 1: "1.50", X: "4.50", 2: "5.80" },
                events: [], stats: { possession: ["-", "-"], shots: ["-", "-"], corners: ["-", "-"] }
            }
        ];

        let currentFilter = 'all';
        let selectedMatch = null;

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'live', 'finished', 'scheduled'].forEach(f => {
                const btn = document.getElementById('f-' + f);
                btn.className = f === filter ? "px-3 py-1 rounded bg-fsOrange text-white font-bold transition" : "px-3 py-1 rounded text-slate-300 hover:text-white transition";
            });
            render();
        }

        function render() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            const filtered = matches.filter(m => {
                if(currentFilter === 'live') return m.status === 'LIVE';
                if(currentFilter === 'finished') return m.status === 'FINISHED';
                if(currentFilter === 'scheduled') return m.status === 'SCHEDULED';
                return true;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">No hay partidos para mostrar.</div>`;
                return;
            }

            let lastLeague = '';
            filtered.forEach(m => {
                if(m.league !== lastLeague) {
                    lastLeague = m.league;
                    const h = document.createElement('div');
                    h.className = "bg-slate-800/90 px-4 py-2 border-b border-slate-700/80 text-xs font-bold text-white flex items-center space-x-2";
                    h.innerHTML = `<span>${m.flag}</span> <span>${m.country}:</span> <span class="text-white font-black ml-1">${m.league}</span>`;
                    container.appendChild(h);
                }

                const row = document.createElement('div');
                row.className = "px-4 py-3 flex items-center justify-between hover:bg-slate-800/60 transition cursor-pointer text-xs sm:text-sm";
                row.onclick = () => openModal(m);

                let badge = m.status === 'LIVE' ? `<span class="text-fsGreen font-bold live-pulse w-12 text-center">${m.time}</span>` :
                            m.status === 'FINISHED' ? `<span class="text-slate-400 w-12 text-center">FT</span>` :
                            `<span class="text-slate-400 font-mono w-12 text-center">${m.time}</span>`;

                let score = m.status === 'SCHEDULED' ? `<span class="text-slate-500 font-mono">- : -</span>` :
                            `<span class="font-bold text-white font-mono">${m.homeScore}</span><span class="text-slate-500 mx-1">-</span><span class="font-bold text-white font-mono">${m.awayScore}</span>`;

                row.innerHTML = `
                    <div class="flex items-center space-x-3 w-5/12 sm:w-4/12">
                        <i class="fa-regular fa-star text-slate-600 hover:text-yellow-400"></i>
                        ${badge}
                        <div class="truncate">
                            <div class="truncate font-medium text-slate-200">${m.home}</div>
                            <div class="truncate font-medium text-slate-200">${m.away}</div>
                        </div>
                    </div>
                    <div class="w-2/12 text-center">
                        <div class="bg-slate-900/60 px-3 py-1 rounded border border-slate-700/60 inline-block">${score}</div>
                    </div>
                    <div class="hidden sm:flex items-center justify-end space-x-3 w-4/12 text-xs font-mono text-slate-400">
                        <span class="bg-slate-900/40 px-2 py-1 rounded">${m.odds[1]}</span>
                        <span class="bg-slate-900/40 px-2 py-1 rounded">${m.odds['X']}</span>
                        <span class="bg-slate-900/40 px-2 py-1 rounded">${m.odds[2]}</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function openModal(m) {
            selectedMatch = m;
            document.getElementById('modalLeague').innerText = `${m.flag} ${m.country}: ${m.league}`;
            document.getElementById('modalHome').innerText = m.home;
            document.getElementById('modalAway').innerText = m.away;
            document.getElementById('modalScore').innerText = m.status === 'SCHEDULED' ? 'vs' : `${m.homeScore} - ${m.awayScore}`;
            document.getElementById('modalStatus').innerText = m.status === 'LIVE' ? `En Directo ${m.time}` : m.status === 'FINISHED' ? 'Finalizado (FT)' : `Programado - ${m.time}`;
            switchTab('summary');
            document.getElementById('matchModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('matchModal').classList.add('hidden');
        }

        function switchTab(tab) {
            ['summary', 'stats', 'lineups', 'standings'].forEach(t => {
                document.getElementById('mtab-' + t).className = t === tab ? "flex-1 py-3 text-fsOrange border-b-2 border-fsOrange transition font-bold" : "flex-1 py-3 text-slate-400 hover:text-white transition";
            });
            const content = document.getElementById('modalContent');
            const m = selectedMatch;

            if(tab === 'summary') {
                if(!m.events.length) { content.innerHTML = `<p class="text-center text-slate-400 py-6">Sin incidencias.</p>`; return; }
                content.innerHTML = m.events.map(e => `
                    <div class="flex justify-between bg-slate-800/40 p-2.5 rounded border border-slate-800 text-xs">
                        <div>${e.team==='home' ? '⚽ ' + e.player + ' ('+e.score+')' : ''}</div>
                        <div class="font-mono font-bold">${e.time}</div>
                        <div>${e.team==='away' ? '⚽ ' + e.player + ' ('+e.score+')' : ''}</div>
                    </div>
                `).join('');
            } else if(tab === 'stats') {
                if(m.status === 'SCHEDULED') { content.innerHTML = `<p class="text-center text-slate-400 py-6">Estadísticas no disponibles aún.</p>`; return; }
                content.innerHTML = `
                    <div class="space-y-3 text-xs">
                        <div class="flex justify-between text-slate-400"><span>${m.stats.possession[0]}</span><span>Posesión</span><span>${m.stats.possession[1]}</span></div>
                        <div class="flex justify-between text-slate-400"><span>${m.stats.shots[0]}</span><span>Remates</span><span>${m.stats.shots[1]}</span></div>
                        <div class="flex justify-between text-slate-400"><span>${m.stats.corners[0]}</span><span>Córners</span><span>${m.stats.corners[1]}</span></div>
                    </div>
                `;
            } else if(tab === 'lineups') {
                content.innerHTML = `<p class="text-center text-slate-400 py-6">Alineaciones confirmadas (4-3-3 vs 4-4-2).</p>`;
            } else if(tab === 'standings') {
                content.innerHTML = `<p class="text-center text-slate-400 py-6">Tabla de clasificación general disponible en breve.</p>`;
            }
        }

        render();
    </script>
</body>
</html>
